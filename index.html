<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Site 💙</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#dbeafe,#eff6ff);
      min-height:100vh;
      padding:30px 20px;
      color:#1e293b;
    }
    .caixa{
      max-width:600px;
      margin:0 auto;
      background:#fff;
      border-radius:24px;
      padding:35px 25px;
      box-shadow:0 8px 32px rgba(59,130,246,.12);
    }
    h1{
      text-align:center;
      color:#3b82f6;
      font-size:1.8rem;
      margin-bottom:30px;
    }
    h2{
      color:#3b82f6;
      font-size:1.15rem;
      margin:40px 0 15px;
      padding-bottom:8px;
      border-bottom:2px solid #dbeafe;
    }
    .musica-box{
      background:#eff6ff;
      border-radius:14px;
      padding:18px;
      text-align:center;
    }
    .musica-box h3{color:#1e40af; margin-bottom:10px; font-size:1rem;}
    audio{width:100%; border-radius:8px;}
    .foto-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:12px;
    }
    .foto-card{
      background:#eff6ff;
      border-radius:12px;
      overflow:hidden;
    }
    .foto-card img{width:100%; height:140px; object-fit:cover; display:block;}
    .foto-card p{padding:10px; font-size:.9rem; color:#475569; text-align:center;}
    .video-card{
      background:#eff6ff;
      border-radius:12px;
      overflow:hidden;
      margin-bottom:12px;
    }
    .video-card video{width:100%; height:180px; object-fit:cover; display:block;}
    .video-card p{padding:10px; font-size:.9rem; color:#475569; text-align:center;}
    .cartinha{
      background:linear-gradient(135deg,#fff8f8,#eff6ff);
      border-radius:14px;
      padding:20px;
      margin-bottom:12px;
      border-left:4px solid #3b82f6;
    }
    .cartinha h3{color:#3b82f6; margin-bottom:10px; font-size:1rem;}
    .mensagem{
      background:#eff6ff;
      border-radius:10px;
      padding:14px 16px;
      margin-bottom:8px;
      font-size:1rem;
    }
    .vazio{
      text-align:center;
      color:#94a3b8;
      padding:25px;
      font-style:italic;
    }
    .aviso-topo{
      background:#dbeafe;
      color:#1e40af;
      padding:10px 14px;
      border-radius:10px;
      font-size:.9rem;
      text-align:center;
      margin-bottom:25px;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>💙 Nosso Site 💙</h1>
    <div class="aviso-topo">💡 Depois de salvar no Painel → atualize esta página!</div>

    <h2>🎵 Nossa Música</h2>
    <div id="musica">Carregando...</div>

    <h2>✨ Mensagens</h2>
    <div id="msgs">Carregando...</div>

    <h2>📸 Fotos</h2>
    <div id="fotos">Carregando...</div>

    <h2>🎬 Vídeos</h2>
    <div id="videos">Carregando...</div>

    <h2>💌 Cartinhas</h2>
    <div id="cartas">Carregando...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = atob("aHR0cHM6Ly9ocmR5aG Ric2Nkem9laG91aXRleC5zdXBhYmFzZS5jbw==");
    const SUPABASE_KEY = atob("c2Jfc2VjcmV0XWk4Smd0LXp2ZGx4eTBPcTNFCG9zZ19aYkk0XzV3Qw==");
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      await carregarMusica();
      await carregarMsgs();
      await carregarFotos();
      await carregarVideos();
      await carregarCartas();
    });

    async function carregarMusica(){
      const el = document.getElementById("musica");
      try {
        const {data} = await supabase.from("configuracoes").select("*").limit(1).single();
        if(!data || !data.musica_url){
          el.innerHTML = '<p class="vazio">Nenhuma música ainda 🎵</p>';
          return;
        }
        el.innerHTML = `
          <div class="musica-box">
            <h3>${data.musica_nome || 'Nossa Música 💙'}</h3>
            <audio controls><source src="${data.musica_url}" type="audio/mpeg">
          </div>`;
      } catch { el.innerHTML = '<p class="vazio">Nenhuma música ainda 🎵</p>'; }
    }

    async function carregarMsgs(){
      const el = document.getElementById("msgs");
      const {data} = await supabase.from("mensagens").select("*").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhuma mensagem ainda ✨</p>'; return; }
      el.innerHTML = data.map(m=>`<div class="mensagem">${m.emoji} ${m.texto}</div>`).join('');
    }

    async function carregarFotos(){
      const el = document.getElementById("fotos");
      const {data} = await supabase.from("fotos").select("*").eq("tipo","foto").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhuma foto ainda 📸</p>'; return; }
      el.innerHTML = '<div class="foto-grid">' + data.map(f=>`
        <div class="foto-card"><img src="${f.url}" loading="lazy"><p>${f.legenda||'📸'}</p></div>`).join('') + '</div>';
    }

    async function carregarVideos(){
      const el = document.getElementById("videos");
      const {data} = await supabase.from("fotos").select("*").eq("tipo","video").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhum vídeo ainda 🎬</p>'; return; }
      el.innerHTML = data.map(v=>`
        <div class="video-card"><video src="${v.url}" controls></video><p>${v.legenda||'🎬'}</p></div>`).join('');
    }

    async function carregarCartas(){
      const el = document.getElementById("cartas");
      const {data} = await supabase.from("cartinhas").select("*").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhuma cartinha ainda 💌</p>'; return; }
      el.innerHTML = data.map(c=>`
        <div class="cartinha"><h3>💌 ${c.titulo}</h3><p>${c.conteudo.replace(/\n/g,'<br>')}</p></div>`).join('');
    }
  </script>
</body>
</html>
