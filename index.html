<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Site 💙</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height:100vh;
      color:#fff;
      text-align:center;
      padding:40px 20px;
    }
    .caixa{
      background:rgba(255,255,255,.12);
      backdrop-filter:blur(10px);
      border-radius:24px;
      padding:40px 25px;
      max-width:600px;
      margin:0 auto;
      border:1px solid rgba(255,255,255,.18);
    }
    h1{font-size:2.2rem; margin-bottom:10px;}
    .sub{opacity:.9; margin-bottom:30px; font-size:1.1rem;}
    .musica{
      background:rgba(255,255,255,.15);
      border-radius:14px;
      padding:18px;
      margin:20px 0;
    }
    audio{width:100%; margin-top:10px; border-radius:8px;}
    .foto-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:12px;
      margin-top:15px;
    }
    .foto-card{
      background:rgba(255,255,255,.15);
      border-radius:12px;
      overflow:hidden;
    }
    .foto-card img{width:100%; height:140px; object-fit:cover;}
    .foto-card p{padding:8px; font-size:.9rem;}
    .cartinha{
      background:rgba(255,255,255,.15);
      border-radius:14px;
      padding:20px;
      margin:12px 0;
      text-align:left;
    }
    .mensagem{
      background:rgba(255,255,255,.15);
      border-radius:10px;
      padding:14px;
      margin:8px 0;
    }
    h2{margin:35px 0 10px; font-size:1.2rem; opacity:.95;}
    .vazio{opacity:.6; font-style:italic; padding:20px;}
  </style>
</head>
<body>
  <div class="caixa">
    <h1>💙 Para Você 💙</h1>
    <p class="sub">Tudo o que sinto por você 💙</p>

    <h2>🎵 Nossa Música</h2>
    <div id="musica"></div>

    <h2>✨ Mensagens</h2>
    <div id="msgs"></div>

    <h2>📸 Nossas Fotos</h2>
    <div id="fotos"></div>

    <h2>🎬 Nossos Vídeos</h2>
    <div id="videos"></div>

    <h2>💌 Cartinhas</h2>
    <div id="cartas"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = atob("aHR0cHM6Ly9ocmR5aG Ric2Nkem9laG91aXRleC5zdXBhYmFzZS5jbw==");
    const SUPABASE_KEY = atob("c2Jfc2VjcmV0XWk4Smd0LXp2ZGx4eTBPcTNFCG9zZ19aYkk0XzV3Qw==");
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      await carregarMusica();
      await carregarMsgs();
      await carregarFotos();
      await carregarVideos();
      await carregarCartas();
    });

    async function carregarMusica(){
      const el = document.getElementById("musica");
      try {
        const {data} = await supabase.from("configuracoes").select("*").limit(1).single();
        if(!data || !data.musica_url) throw 1;
        el.innerHTML = `<div class="musica"><strong>${data.musica_nome||'Nossa Música 💙'}</strong><audio controls><source src="${data.musica_url}"></div>`;
      } catch { el.innerHTML = '<p class="vazio">Nenhuma música cadastrada 🎵</p>'; }
    }

    async function carregarMsgs(){
      const el = document.getElementById("msgs");
      const {data} = await supabase.from("mensagens").select("*").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhuma mensagem ✨</p>'; return; }
      el.innerHTML = data.map(m=>`<div class="mensagem">${m.emoji} ${m.texto}</div>`).join('');
    }

    async function carregarFotos(){
      const el = document.getElementById("fotos");
      const {data} = await supabase.from("fotos").select("*").eq("tipo","foto").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhuma foto 📸</p>'; return; }
      el.innerHTML = '<div class="foto-grid">' + data.map(f=>`<div class="foto-card"><img src="${f.url}" loading="lazy"><p>${f.legenda||''}</p></div>`).join('') + '</div>';
    }

    async function carregarVideos(){
      const el = document.getElementById("videos");
      const {data} = await supabase.from("fotos").select("*").eq("tipo","video").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhum vídeo 🎬</p>'; return; }
      el.innerHTML = data.map(v=>`<div class="foto-card"><video src="${v.url}" controls style="width:100%;height:140px;object-fit:cover;"></video><p>${v.legenda||''}</p></div>`).join('');
    }

    async function carregarCartas(){
      const el = document.getElementById("cartas");
      const {data} = await supabase.from("cartinhas").select("*").order("created_at",{ascending:false});
      if(!data || !data.length){ el.innerHTML = '<p class="vazio">Nenhuma cartinha 💌</p>'; return; }
      el.innerHTML = data.map(c=>`<div class="cartinha"><h3>💌 ${c.titulo}</h3><p style="margin-top:10px;white-space:pre-line;">${c.conteudo}</p></div>`).join('');
    }
  </script>
</body>
</html>
