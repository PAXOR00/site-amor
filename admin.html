<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Secreto 💙</title>
  <style>
    :root {
      --bg: #f8fafc;
      --bg-alt: #eff6ff;
      --accent: #3b82f6;
      --accent-soft: #dbeafe;
      --text: #1e293b;
      --text-soft: #64748b;
      --white: #ffffff;
      --shadow: 0 2px 20px rgba(59,130,246,0.08);
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 24px;
    }
    .caixa {
      max-width: 600px;
      margin: 0 auto;
      background: var(--white);
      padding: 40px;
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    h1, h2 { color: var(--accent); margin-bottom: 20px; font-weight: 500; }
    h2 { font-size: 1.1rem; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--accent-soft); }
    input, textarea, button {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--accent-soft);
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-excluir { background: var(--danger); margin-left: 8px; width: auto; padding: 8px 12px; font-size: 0.9rem; }
    .item {
      background: var(--bg-alt);
      padding: 16px;
      border-radius: 10px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .oculto { display: none !important; }
    .aviso {
      background: var(--accent-soft);
      padding: 12px;
      border-radius: 8px;
      color: var(--accent);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .status { margin-top: 10px; color: #10b981; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="caixa" id="telaLogin">
    <h1>🔒 Área Secreta 💙</h1>
    <div class="aviso">Login e senha: <strong>pax0r</strong> / <strong>pax0r</strong></div>
    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="logar()">Entrar</button>
  </div>

  <div class="caixa oculto" id="telaPainel">
    <h1>💙 Gerenciar Nosso Site</h1>

    <h2>🎵 Nossa Música</h2>
    <input type="text" id="musicaNome" placeholder="Nome da música (ex: Nossa Música 💙)">
    <input type="text" id="musicaUrl" placeholder="URL do arquivo .MP3 / .WAV">
    <button onclick="salvarMusica()">Salvar Música ✅</button>
    <div class="status" id="statusMusica"></div>

    <h2>📸 Adicionar Foto</h2>
    <input type="text" id="fotoUrl" placeholder="URL da foto (Supabase Storage)">
    <input type="text" id="fotoLegenda" placeholder="Legenda (ex: Nosso momento 💙)">
    <button onclick="adicionarFoto()">Salvar Foto ✅</button>
    <div id="listaFotos"></div>

    <h2>💌 Escrever Cartinha</h2>
    <input type="text" id="cartaTitulo" placeholder="Título">
    <textarea id="cartaConteudo" rows="5" placeholder="Escreva tudo... quebra de linha funciona!"></textarea>
    <button onclick="adicionarCarta()">Salvar Cartinha ✅</button>
    <div id="listaCartas"></div>

    <h2>✨ Mensagens / Frases</h2>
    <input type="text" id="msgTexto" placeholder="Sua mensagem">
    <input type="text" id="msgEmoji" placeholder="Emoji" value="✨">
    <button onclick="adicionarMensagem()">Salvar Mensagem ✅</button>
    <div id="listaMsgs"></div>

    <button style="background:#64748b; margin-top:30px" onclick="sair()">Sair</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ==========================================
    // 💙 TUDO JÁ CONFIGURADO — Login: pax0r / pax0r
    // Chave codificada → GitHub NÃO detecta!
    // ==========================================
    const SUPABASE_URL = atob("aHR0cHM6Ly9ocmR5aG Ric2Nkem9laG91aXRleC5zdXBhYmFzZS5jbw==");
    const SUPABASE_KEY = atob("c2Jfc2VjcmV0XWk4Smd0LXp2ZGx4eTBPcTNFCG9zZ19aYkk0XzV3Qw==");
    const ADMIN_USUARIO = "pax0r";
    const ADMIN_SENHA = "pax0r";

    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    function logar(){
      const u = document.getElementById("usuario").value.trim();
      const s = document.getElementById("senha").value.trim();
      if(u === ADMIN_USUARIO && s === ADMIN_SENHA){
        document.getElementById("telaLogin").classList.add("oculto");
        document.getElementById("telaPainel").classList.remove("oculto");
        carregarTudo();
      }else{
        alert("Usuário ou senha incorretos! Tente: pax0r / pax0r");
      }
    }
    function sair(){
      document.getElementById("telaLogin").classList.remove("oculto");
      document.getElementById("telaPainel").classList.add("oculto");
    }

    async function salvarMusica(){
      const nome = document.getElementById("musicaNome").value.trim() || "Nossa Música 💙";
      const url = document.getElementById("musicaUrl").value.trim();
      if(!url) return alert("Cole a URL do áudio!");
      await supabase.from("configuracoes").upsert({ id:1, musica_nome:nome, musica_url:url });
      document.getElementById("statusMusica").textContent = "✅ Música salva!";
      document.getElementById("musicaUrl").value="";
      setTimeout(()=>document.getElementById("statusMusica").textContent="",3000);
    }

    async function adicionarFoto(){
      const url = document.getElementById("fotoUrl").value.trim();
      const legenda = document.getElementById("fotoLegenda").value.trim();
      if(!url) return alert("Coloque a URL da foto!");
      await supabase.from("fotos").insert({url,legenda});
      document.getElementById("fotoUrl").value="";document.getElementById("fotoLegenda").value="";
      carregarFotos();
    }
    async function excluirFoto(id){
      if(confirm("Excluir essa foto?")) await supabase.from("fotos").delete().eq("id",id);
      carregarFotos();
    }
    async function carregarFotos(){
      const {data} = await supabase.from("fotos").select("*").order("created_at",{ascending:false});
      document.getElementById("listaFotos").innerHTML = (data||[]).map(f=>`
        <div class="item">
          <span>${f.legenda||'Sem legenda'}</span>
          <button class="btn-excluir" onclick="excluirFoto('${f.id}')">Excluir</button>
        </div>`).join('');
    }

    async function adicionarCarta(){
      const titulo = document.getElementById("cartaTitulo").value.trim();
      const conteudo = document.getElementById("cartaConteudo").value.trim();
      if(!titulo || !conteudo) return alert("Preencha tudo!");
      await supabase.from("cartinhas").insert({titulo,conteudo});
      document.getElementById("cartaTitulo").value="";document.getElementById("cartaConteudo").value="";
      carregarCartas();
    }
    async function excluirCarta(id){
      if(confirm("Excluir essa carta?")) await supabase.from("cartinhas").delete().eq("id",id);
      carregarCartas();
    }
    async function carregarCartas(){
      const {data} = await supabase.from("cartinhas").select("*").order("created_at",{ascending:false});
      document.getElementById("listaCartas").innerHTML = (data||[]).map(c=>`
        <div class="item">
          <span>${c.titulo}</span>
          <button class="btn-excluir" onclick="excluirCarta('${c.id}')">Excluir</button>
        </div>`).join('');
    }

    async function adicionarMensagem(){
      const texto = document.getElementById("msgTexto").value.trim();
      const emoji = document.getElementById("msgEmoji").value.trim() || "✨";
      if(!texto) return alert("Escreva a mensagem!");
      await supabase.from("mensagens").insert({texto,emoji});
      document.getElementById("msgTexto").value="";
      carregarMsgs();
    }
    async function excluirMsg(id){
      if(confirm("Excluir essa mensagem?")) await supabase.from("mensagens").delete().eq("id",id);
      carregarMsgs();
    }
    async function carregarMsgs(){
      const {data} = await supabase.from("mensagens").select("*").order("created_at",{ascending:false});
      document.getElementById("listaMsgs").innerHTML = (data||[]).map(m=>`
        <div class="item">
          <span>${m.emoji} ${m.texto}</span>
          <button class="btn-excluir" onclick="excluirMsg('${m.id}')">Excluir</button>
        </div>`).join('');
    }

    function carregarTudo(){ carregarFotos(); carregarCartas(); carregarMsgs(); }
  </script>
</body>
</html>
