<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Secreto 💙</title>
  <style>
    :root {
      --bg: #f8fafc;
      --bg-alt: #eff6ff;
      --accent: #3b82f6;
      --accent-soft: #dbeafe;
      --text: #1e293b;
      --text-soft: #64748b;
      --white: #ffffff;
      --shadow: 0 2px 20px rgba(59,130,246,0.08);
      --danger: #ef4444;
      --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 24px;
    }
    .caixa {
      max-width: 700px;
      margin: 0 auto;
      background: var(--white);
      padding: 40px;
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    h1, h2 { color: var(--accent); margin-bottom: 20px; font-weight: 500; }
    h2 { font-size: 1.1rem; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--accent-soft); }
    input, textarea, button {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--accent-soft);
      font-size: 1rem;
      font-family: inherit;
    }
    input[type="file"] { padding: 10px; background: var(--bg-alt); }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-excluir { background: var(--danger); margin-left: 8px; width: auto; padding: 8px 12px; font-size: 0.9rem; }
    .item {
      background: var(--bg-alt);
      padding: 16px;
      border-radius: 10px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .item-conteudo { width: 100%; margin-top: 8px; color: var(--text-soft); font-size: 0.95rem; }
    .status { margin-top: 10px; color: var(--success); font-size: 0.9rem; font-weight:500; }
    .erro { color: var(--danger); }
    .logs-box {
      background: #f0fdf4;
      border-left: 4px solid var(--success);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .logs-box p { margin: 4px 0; font-size: 0.95rem; }
    .log-data { color: var(--text-soft); font-size: 0.85rem; }
    .preview-card {
      background: var(--bg-alt);
      padding: 12px;
      border-radius: 8px;
      margin: 8px 0;
      border-left: 3px solid var(--accent);
    }
    .preview-card img, .preview-card video { max-width: 100%; border-radius: 6px; margin-top: 8px; }
    .vazio { color: var(--text-soft); text-align: center; padding: 16px; font-style: italic; }
    .barra { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow:hidden; margin:8px 0; display:none; }
    .barra span { display:block; height:100%; background:var(--accent); width:0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <div class="caixa">
    <h1>💙 Gerenciar Nosso Site</h1>

    <!-- 📊 LOGS DE ACESSO -->
    <div class="logs-box">
      <h3>📊 Acessos ao Painel</h3>
      <p><strong>Total de entradas:</strong> <span id="totalAcessos">0</span></p>
      <p><strong>Último acesso:</strong> <span id="ultimoAcesso">Carregando...</span></p>
      <div id="listaLogs" style="margin-top:10px;max-height:150px;overflow-y:auto;"></div>
    </div>

    <!-- 🎵 MÚSICA — UPLOAD DE ARQUIVO -->
    <h2>🎵 Nossa Música</h2>
    <div id="previewMusica" class="preview-card" style="display:none;">
      <strong>Salvo ✅:</strong>
      <p id="nomeMusicaAtual"></p>
    </div>
    <input type="text" id="musicaNome" placeholder="Nome da música (ex: Nossa Música 💙)">
    <input type="file" id="musicaArquivo" accept="audio/*">
    <div class="barra" id="barraMusica"><span id="pMusica"></span></div>
    <button onclick="salvarMusica()">Salvar Música ✅</button>
    <div class="status" id="statusMusica"></div>

    <!-- 📸 FOTOS — UPLOAD DE ARQUIVO -->
    <h2>📸 Adicionar Foto</h2>
    <input type="file" id="fotoArquivo" accept="image/*">
    <input type="text" id="fotoLegenda" placeholder="Legenda (ex: Nosso momento 💙)">
    <div class="barra" id="barraFoto"><span id="pFoto"></span></div>
    <button onclick="adicionarFoto()">Salvar Foto ✅</button>
    <h3 style="margin-top:20px; font-size:0.95rem; color:var(--text-soft);">📸 Fotos Cadastradas:</h3>
    <div id="listaFotos"></div>

    <!-- 🎬 VÍDEOS -->
    <h2>🎬 Adicionar Vídeo</h2>
    <input type="file" id="videoArquivo" accept="video/*">
    <input type="text" id="videoLegenda" placeholder="Legenda do vídeo">
    <div class="barra" id="barraVideo"><span id="pVideo"></span></div>
    <button onclick="adicionarVideo()">Salvar Vídeo ✅</button>
    <h3 style="margin-top:20px; font-size:0.95rem; color:var(--text-soft);">🎬 Vídeos Cadastrados:</h3>
    <div id="listaVideos"></div>

    <!-- 💌 CARTINHAS -->
    <h2>💌 Escrever Cartinha</h2>
    <input type="text" id="cartaTitulo" placeholder="Título">
    <textarea id="cartaConteudo" rows="5" placeholder="Escreva tudo... quebra de linha funciona!"></textarea>
    <button onclick="adicionarCarta()">Salvar Cartinha ✅</button>
    <h3 style="margin-top:20px; font-size:0.95rem; color:var(--text-soft);">💌 Cartinhas Cadastradas:</h3>
    <div id="listaCartas"></div>

    <!-- ✨ MENSAGENS -->
    <h2>✨ Mensagens / Frases</h2>
    <input type="text" id="msgTexto" placeholder="Sua mensagem">
    <input type="text" id="msgEmoji" placeholder="Emoji" value="✨">
    <button onclick="adicionarMensagem()">Salvar Mensagem ✅</button>
    <h3 style="margin-top:20px; font-size:0.95rem; color:var(--text-soft);">✨ Mensagens Cadastradas:</h3>
    <div id="listaMsgs"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ==========================================
    // 💙 CONFIGURAÇÕES
    // ==========================================
    const SUPABASE_URL = atob("aHR0cHM6Ly9ocmR5aG Ric2Nkem9laG91aXRleC5zdXBhYmFzZS5jbw==");
    const SUPABASE_KEY = atob("c2Jfc2VjcmV0XWk4Smd0LXp2ZGx4eTBPcTNFCG9zZ19aYkk0XzV3Qw==");
    const BUCKET = "site-amor"; // Pasta onde os arquivos serão salvos

    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==========================================
    // 🚀 CARREGA TUDO AO ABRIR
    // ==========================================
    document.addEventListener("DOMContentLoaded", async () => {
      await registrarAcesso();
      await carregarLogs();
      await carregarMusica();
      await carregarFotos();
      await carregarVideos();
      await carregarCartas();
      await carregarMsgs();
    });

    // ==========================================
    // 📊 LOGS — CORRIGIDO!
    // ==========================================
    async function registrarAcesso(){
      try {
        const agora = new Date().toLocaleString("pt-BR");
        await supabase.from("logs_acesso").insert({ data_acesso: agora });
      } catch(e) {
        console.log("Logs: ", e.message);
      }
    }

    async function carregarLogs(){
      try {
        const {data, error} = await supabase.from("logs_acesso").select("*").order("id",{ascending:false});
        if(error) throw error;
        if(data && data.length > 0){
          document.getElementById("totalAcessos").textContent = data.length;
          document.getElementById("ultimoAcesso").textContent = data[0].data_acesso;
          document.getElementById("listaLogs").innerHTML = data.slice(0,5).map(l=>
            `<p class="log-data">• ${l.data_acesso}</p>`
          ).join('');
        } else {
          document.getElementById("ultimoAcesso").textContent = "Primeiro acesso! ✅";
          document.getElementById("listaLogs").innerHTML = '<p class="vazio">Aguardando próximos acessos...</p>';
        }
      } catch(e) {
        document.getElementById("ultimoAcesso").innerHTML = `<span style="color:var(--danger)">⚠️ Crie a tabela logs_acesso no Supabase</span>`;
      }
    }

    // ==========================================
    // 📤 FUNÇÃO DE UPLOAD — SELECIONA ARQUIVO DIRETO!
    // ==========================================
    async function uploadArquivo(arquivo, pasta){
      const nome = Date.now() + "_" + arquivo.name.replace(/[^a-z0-9.]/gi, '_');
      const caminho = `${pasta}/${nome}`;
      
      const {data, error} = await supabase.storage
        .from(BUCKET)
        .upload(caminho, arquivo, { upsert: true });
      
      if(error) throw error;
      
      const {data:{publicUrl}} = supabase.storage
        .from(BUCKET)
        .getPublicUrl(caminho);
      
      return publicUrl;
    }

    // ==========================================
    // 🎵 MÚSICA — UPLOAD DE ARQUIVO
    // ==========================================
    async function salvarMusica(){
      const nome = document.getElementById("musicaNome").value.trim() || "Nossa Música 💙";
      const arquivo = document.getElementById("musicaArquivo").files[0];
      
      if(!arquivo) return alert("Escolha um arquivo de música! 🎵");
      
      try {
        document.getElementById("barraMusica").style.display = "block";
        document.getElementById("pMusica").style.width = "50%";
        
        const url = await uploadArquivo(arquivo, "musicas");
        
        document.getElementById("pMusica").style.width = "100%";
        
        const {error} = await supabase.from("configuracoes").upsert({ 
          id: 1, 
          musica_nome: nome, 
          musica_url: url 
        });
        if(error) throw error;
        
        document.getElementById("statusMusica").textContent = "✅ Música salva com sucesso!";
        document.getElementById("musicaArquivo").value = "";
        document.getElementById("musicaNome").value = "";
        document.getElementById("barraMusica").style.display = "none";
        
        await carregarMusica();
        setTimeout(()=>document.getElementById("statusMusica").textContent = "", 4000);
      } catch(e) {
        document.getElementById("statusMusica").innerHTML = `<span class="erro">❌ Erro: ${e.message}</span>`;
        document.getElementById("barraMusica").style.display = "none";
      }
    }

    async function carregarMusica(){
      try {
        const {data, error} = await supabase.from("configuracoes").select("*").limit(1).single();
        if(error) return;
        if(data && data.musica_url){
          document.getElementById("previewMusica").style.display = "block";
          document.getElementById("nomeMusicaAtual").textContent = `🎵 ${data.musica_nome || 'Sem nome'}`;
        }
      } catch(e) {}
    }

    // ==========================================
    // 📸 FOTOS — UPLOAD DE ARQUIVO
    // ==========================================
    async function adicionarFoto(){
      const arquivo = document.getElementById("fotoArquivo").files[0];
      const legenda = document.getElementById("fotoLegenda").value.trim();
      
      if(!arquivo) return alert("Escolha uma foto primeiro! 📸");
      
      try {
        document.getElementById("barraFoto").style.display = "block";
        document.getElementById("pFoto").style.width = "50%";
        
        const url = await uploadArquivo(arquivo, "fotos");
        
        document.getElementById("pFoto").style.width = "100%";
        
        const {error} = await supabase.from("fotos").insert({ url, legenda });
        if(error) throw error;
        
        document.getElementById("fotoArquivo").value = "";
        document.getElementById("fotoLegenda").value = "";
        document.getElementById("barraFoto").style.display = "none";
        
        await carregarFotos();
        alert("✅ Foto salva com sucesso!");
      } catch(e) {
        alert("❌ Erro: " + e.message);
        document.getElementById("barraFoto").style.display = "none";
      }
    }

    async function excluirFoto(id){
      if(confirm("Excluir essa foto?")){
        await supabase.from("fotos").delete().eq("id", id);
        await carregarFotos();
      }
    }

    async function carregarFotos(){
      const {data, error} = await supabase.from("fotos").select("*").order("created_at", {ascending:false});
      const container = document.getElementById("listaFotos");
      
      if(error) { container.innerHTML = `<p class="vazio">Erro: ${error.message}</p>`; return; }
      if(!data || data.length === 0){
        container.innerHTML = '<p class="vazio">Nenhuma foto cadastrada ainda 💙</p>';
        return;
      }
      
      container.innerHTML = data.map(f=>`
        <div class="item">
          <div style="flex:1;min-width:200px;">
            <strong>📸 ${f.legenda || 'Sem legenda'}</strong>
            <div class="item-conteudo"><img src="${f.url}" alt="${f.legenda}" loading="lazy"></div>
          </div>
          <button class="btn-excluir" onclick="excluirFoto('${f.id}')">Excluir</button>
        </div>`).join('');
    }

    // ==========================================
    // 🎬 VÍDEOS — UPLOAD DE ARQUIVO
    // ==========================================
    async function adicionarVideo(){
      const arquivo = document.getElementById("videoArquivo").files[0];
      const legenda = document.getElementById("videoLegenda").value.trim();
      
      if(!arquivo) return alert("Escolha um vídeo primeiro! 🎬");
      
      try {
        document.getElementById("barraVideo").style.display = "block";
        document.getElementById("pVideo").style.width = "50%";
        
        const url = await uploadArquivo(arquivo, "videos");
        
        document.getElementById("pVideo").style.width = "100%";
        
        const {error} = await supabase.from("fotos").insert({ url, legenda, tipo: "video" });
        if(error) throw error;
        
        document.getElementById("videoArquivo").value = "";
        document.getElementById("videoLegenda").value = "";
        document.getElementById("barraVideo").style.display = "none";
        
        await carregarVideos();
        alert("✅ Vídeo salvo com sucesso!");
      } catch(e) {
        alert("❌ Erro: " + e.message);
        document.getElementById("barraVideo").style.display = "none";
      }
    }

    async function excluirVideo(id){
      if(confirm("Excluir esse vídeo?")){
        await supabase.from("fotos").delete().eq("id", id);
        await carregarVideos();
      }
    }

    async function carregarVideos(){
      const {data, error} = await supabase.from("fotos").select("*").eq("tipo","video").order("created_at", {ascending:false});
      const container = document.getElementById("listaVideos");
      
      if(error) return;
      if(!data || data.length === 0){
        container.innerHTML = '<p class="vazio">Nenhum vídeo ainda 🎬</p>';
        return;
      }
      
      container.innerHTML = data.map(v=>`
        <div class="item">
          <div style="flex:1;min-width:200px;">
            <strong>🎬 ${v.legenda || 'Sem legenda'}</strong>
            <div class="item-conteudo"><video src="${v.url}" controls style="max-width:250px;border-radius:6px;"></video></div>
          </div>
          <button class="btn-excluir" onclick="excluirVideo('${v.id}')">Excluir</button>
        </div>`).join('');
    }

    // ==========================================
    // 💌 CARTINHAS
    // ==========================================
    async function adicionarCarta(){
      const titulo = document.getElementById("cartaTitulo").value.trim();
      const conteudo = document.getElementById("cartaConteudo").value.trim();
      if(!titulo || !conteudo) return alert("Preencha tudo!");
      
      const {error} = await supabase.from("cartinhas").insert({ titulo, conteudo });
      if(error) return alert("❌ Erro: " + error.message);
      
      document.getElementById("cartaTitulo").value = "";
      document.getElementById("cartaConteudo").value = "";
      await carregarCartas();
      alert("✅ Cartinha salva!");
    }

    async function excluirCarta(id){
      if(confirm("Excluir essa carta?")){
        await supabase.from("cartinhas").delete().eq("id", id);
        await carregarCartas();
      }
    }

    async function carregarCartas(){
      const {data, error} = await supabase.from("cartinhas").select("*").order("created_at", {ascending:false});
      const container = document.getElementById("listaCartas");
      
      if(error) { container.innerHTML = `<p class="vazio">Erro: ${error.message}</p>`; return; }
      if(!data || data.length === 0){
        container.innerHTML = '<p class="vazio">Nenhuma cartinha ainda 💌</p>';
        return;
      }
      
      container.innerHTML = data.map(c=>`
        <div class="item">
          <div style="flex:1;min-width:200px;">
            <strong>💌 ${c.titulo}</strong>
            <div class="item-conteudo">${c.conteudo.replace(/\n/g, '<br>')}</div>
          </div>
          <button class="btn-excluir" onclick="excluirCarta('${c.id}')">Excluir</button>
        </div>`).join('');
    }

    // ==========================================
    // ✨ MENSAGENS
    // ==========================================
    async function adicionarMensagem(){
      const texto = document.getElementById("msgTexto").value.trim();
      const emoji = document.getElementById("msgEmoji").value.trim() || "✨";
      if(!texto) return alert("Escreva a mensagem!");
      
      const {error} = await supabase.from("mensagens").insert({ texto, emoji });
      if(error) return alert("❌ Erro: " + error.message);
      
      document.getElementById("msgTexto").value = "";
      await carregarMsgs();
      alert("✅ Mensagem salva!");
    }

    async function excluirMsg(id){
      if(confirm("Excluir essa mensagem?")){
        await supabase.from("mensagens").delete().eq("id", id);
        await carregarMsgs();
      }
    }

    async function carregarMsgs(){
      const {data, error} = await supabase.from("mensagens").select("*").order("created_at", {ascending:false});
      const container = document.getElementById("listaMsgs");
      
      if(error) { container.innerHTML = `<p class="vazio">Erro: ${error.message}</p>`; return; }
      if(!data || data.length === 0){
        container.innerHTML = '<p class="vazio">Nenhuma mensagem ainda ✨</p>';
        return;
      }
      
      container.innerHTML = data.map(m=>`
        <div class="item">
          <span style="flex:1;">${m.emoji} ${m.texto}</span>
          <button class="btn-excluir" onclick="excluirMsg('${m.id}')">Excluir</button>
        </div>`).join('');
    }
  </script>
</body>
</html>
