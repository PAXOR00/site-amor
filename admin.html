<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Secreto 💙</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#dbeafe,#eff6ff);
      min-height:100vh;
      padding:30px 20px;
      color:#1e293b;
    }
    .caixa{
      max-width:600px;
      margin:0 auto;
      background:#fff;
      border-radius:24px;
      padding:35px 25px;
      box-shadow:0 8px 32px rgba(59,130,246,.12);
    }
    h1{text-align:center; color:#3b82f6; font-size:1.7rem; margin-bottom:25px;}
    h2{color:#3b82f6; font-size:1.1rem; margin:35px 0 12px; padding-top:20px; border-top:2px solid #f1f5f9;}
    input,textarea,button{
      width:100%;
      padding:13px 15px;
      margin:7px 0;
      border-radius:10px;
      border:1px solid #bfdbfe;
      font-size:1rem;
      font-family:inherit;
    }
    input[type="file"]{background:#eff6ff; padding:10px;}
    button{
      background:#3b82f6;
      color:#fff;
      border:none;
      font-weight:500;
      cursor:pointer;
      margin-top:10px;
    }
    button:hover{opacity:.92}
    .btn-excluir{
      background:#ef4444;
      width:auto;
      padding:8px 12px;
      font-size:.85rem;
      margin:0;
    }
    .aviso{
      position:fixed;
      top:15px;
      left:50%;
      transform:translateX(-50%);
      padding:12px 20px;
      border-radius:12px;
      color:#fff;
      font-weight:500;
      z-index:999;
      opacity:0;
      transition:opacity .3s;
      box-shadow:0 4px 16px rgba(0,0,0,.15);
      max-width:90%;
      text-align:center;
    }
    .aviso.verde{background:#10b981; opacity:1;}
    .aviso.vermelho{background:#ef4444; opacity:1;}
    .logs-box{
      background:#f0fdf4;
      border-left:4px solid #10b981;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
    }
    .logs-box p{margin:4px 0; font-size:.95rem;}
    .item{
      background:#f8fafc;
      padding:14px;
      border-radius:10px;
      margin:10px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
    }
    .item-conteudo{width:100%; margin-top:8px; color:#64748b; font-size:.9rem;}
    .vazio{color:#94a3b8; text-align:center; padding:20px; font-style:italic;}
    .barra{height:7px; background:#dbeafe; border-radius:4px; overflow:hidden; margin:8px 0; display:none;}
    .barra span{display:block; height:100%; background:#3b82f6; width:0%; transition:width .3s;}
  </style>
</head>
<body>

  <div class="aviso" id="aviso"></div>

  <div class="caixa">
    <h1>💙 Gerenciar Nosso Site</h1>

    <div class="logs-box">
      <h3>📊 Acessos</h3>
      <p>Total: <span id="total">0</span></p>
      <p>Último: <span id="ultimo">Carregando...</span></p>
      <div id="listaLogs" style="margin-top:8px;max-height:120px;overflow:auto;font-size:.85rem;"></div>
    </div>

    <h2>🎵 Nossa Música</h2>
    <input type="text" id="musicaNome" placeholder="Nome da música">
    <input type="file" id="musicaArq" accept="audio/*">
    <div class="barra" id="barraMus"><span></span></div>
    <button onclick="salvarMusica()">Salvar Música ✅</button>

    <h2>📸 Foto</h2>
    <input type="file" id="fotoArq" accept="image/*">
    <input type="text" id="fotoLeg" placeholder="Legenda">
    <div class="barra" id="barraFoto"><span></span></div>
    <button onclick="salvarFoto()">Salvar Foto ✅</button>
    <div id="listaFotos"></div>

    <h2>🎬 Vídeo</h2>
    <input type="file" id="videoArq" accept="video/*">
    <input type="text" id="videoLeg" placeholder="Legenda">
    <div class="barra" id="barraVid"><span></span></div>
    <button onclick="salvarVideo()">Salvar Vídeo ✅</button>
    <div id="listaVideos"></div>

    <h2>💌 Cartinha</h2>
    <input type="text" id="cartaTit" placeholder="Título">
    <textarea id="cartaConteudo" rows="4" placeholder="Sua mensagem..."></textarea>
    <button onclick="salvarCarta()">Salvar Cartinha ✅</button>
    <div id="listaCartas"></div>

    <h2>✨ Mensagem</h2>
    <input type="text" id="msgTexto" placeholder="Mensagem">
    <input type="text" id="msgEmoji" placeholder="Emoji" value="✨">
    <button onclick="salvarMsg()">Salvar Mensagem ✅</button>
    <div id="listaMsgs"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = atob("aHR0cHM6Ly9ocmR5aG Ric2Nkem9laG91aXRleC5zdXBhYmFzZS5jbw==");
    const SUPABASE_KEY = atob("c2Jfc2VjcmV0XWk4Smd0LXp2ZGx4eTBPcTNFCG9zZ19aYkk0XzV3Qw==");
    const BUCKET = "site-amor";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function aviso(texto, ok=true){
      const el = document.getElementById("aviso");
      el.textContent = texto;
      el.className = "aviso " + (ok?"verde":"vermelho");
      setTimeout(()=>el.style.opacity="0", 3500);
    }

    async function subir(arq, pasta){
      const nome = Date.now() + "_" + arq.name.replace(/[^a-z0-9.]/gi,'_');
      const {data, error} = await supabase.storage.from(BUCKET).upload(pasta+"/"+nome, arq);
      if(error) throw error;
      const {data:{publicUrl}} = supabase.storage.from(BUCKET).getPublicUrl(pasta+"/"+nome);
      return publicUrl;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try{
        const agora = new Date().toLocaleString("pt-BR");
        await supabase.from("logs_acesso").insert({data_acesso:agora});
      }catch(e){}
      try{
        const {data} = await supabase.from("logs_acesso").select("*").order("id",{ascending:false});
        if(data && data.length>0){
          document.getElementById("total").textContent = data.length;
          document.getElementById("ultimo").textContent = data[0].data_acesso;
        }
      }catch(e){}
      await listarFotos(); await listarVideos(); await listarCartas(); await listarMsgs();
    });

    async function salvarMusica(){
      const nome = document.getElementById("musicaNome").value.trim() || "Nossa Música 💙";
      const arq = document.getElementById("musicaArq").files[0];
      if(!arq) return aviso("Escolha um arquivo!", false);
      try{
        document.getElementById("barraMus").style.display="block";
        document.querySelector("#barraMus span").style.width="50%";
        const url = await subir(arq, "musicas");
        document.querySelector("#barraMus span").style.width="100%";
        await supabase.from("configuracoes").upsert({id:1, musica_nome:nome, musica_url:url});
        aviso("✅ MÚSICA SALVA! Atualize a página principal!");
        document.getElementById("musicaNome").value="";
        document.getElementById("musicaArq").value="";
        setTimeout(()=>document.getElementById("barraMus").style.display="none",600);
      }catch(e){ aviso("❌ Erro: "+e.message, false); document.getElementById("barraMus").style.display="none"; }
    }

    async function salvarFoto(){
      const arq = document.getElementById("fotoArq").files[0];
      const leg = document.getElementById("fotoLeg").value.trim();
      if(!arq) return aviso("Escolha uma foto!", false);
      try{
        document.getElementById("barraFoto").style.display="block";
        document.querySelector("#barraFoto span").style.width="50%";
        const url = await subir(arq, "fotos");
        document.querySelector("#barraFoto span").style.width="100%";
        await supabase.from("fotos").insert({url, legenda:leg, tipo:"foto"});
        aviso("✅ FOTO SALVA! Atualize a página principal!");
        document.getElementById("fotoArq").value="";
        document.getElementById("fotoLeg").value="";
        setTimeout(()=>document.getElementById("barraFoto").style.display="none",600);
        await listarFotos();
      }catch(e){ aviso("❌ Erro: "+e.message, false); document.getElementById("barraFoto").style.display="none"; }
    }

    async function salvarVideo(){
      const arq = document.getElementById("videoArq").files[0];
      const leg = document.getElementById("videoLeg").value.trim();
      if(!arq) return aviso("Escolha um vídeo!", false);
      try{
        document.getElementById("barraVid").style.display="block";
        document.querySelector("#barraVid span").style.width="50%";
        const url = await subir(arq, "videos");
        document.querySelector("#barraVid span").style.width="100%";
        await supabase.from("fotos").insert({url, legenda:leg, tipo:"video"});
        aviso("✅ VÍDEO SALVO! Atualize a página principal!");
        document.getElementById("videoArq").value="";
        document.getElementById("videoLeg").value="";
        setTimeout(()=>document.getElementById("barraVid").style.display="none",600);
        await listarVideos();
      }catch(e){ aviso("❌ Erro: "+e.message, false); document.getElementById("barraVid").style.display="none"; }
    }

    async function salvarCarta(){
      const tit = document.getElementById("cartaTit").value.trim();
      const cnt = document.getElementById("cartaConteudo").value.trim();
      if(!tit || !cnt) return aviso("Preencha tudo!", false);
      try{
        await supabase.from("cartinhas").insert({titulo:tit, conteudo:cnt});
        aviso("✅ CARTINHA SALVA! Atualize a página principal!");
        document.getElementById("cartaTit").value="";
        document.getElementById("cartaConteudo").value="";
        await listarCartas();
      }catch(e){ aviso("❌ Erro: "+e.message, false); }
    }

    async function salvarMsg(){
      const txt = document.getElementById("msgTexto").value.trim();
      const emj = document.getElementById("msgEmoji").value.trim() || "✨";
      if(!txt) return aviso("Escreva a mensagem!", false);
      try{
        await supabase.from("mensagens").insert({texto:txt, emoji:emj});
        aviso("✅ MENSAGEM SALVA! Atualize a página principal!");
        document.getElementById("msgTexto").value="";
        await listarMsgs();
      }catch(e){ aviso("❌ Erro: "+e.message, false); }
    }

    async function listarFotos(){
      const {data} = await supabase.from("fotos").select("*").eq("tipo","foto").order("created_at",{ascending:false});
      const el = document.getElementById("listaFotos");
      if(!data || !data.length){ el.innerHTML = ""; return; }
      el.innerHTML = data.map(f=>`<div class="item"><div><strong>📸 ${f.legenda||''}</strong></div><button class="btn-excluir" onclick="excluir(${f.id},'foto')">Excluir</button></div>`).join('');
    }
    async function listarVideos(){
      const {data} = await supabase.from("fotos").select("*").eq("tipo","video").order("created_at",{ascending:false});
      const el = document.getElementById("listaVideos");
      if(!data || !data.length){ el.innerHTML = ""; return; }
      el.innerHTML = data.map(v=>`<div class="item"><div><strong>🎬 ${v.legenda||''}</strong></div><button class="btn-excluir" onclick="excluir(${v.id},'video')">Excluir</button></div>`).join('');
    }
    async function listarCartas(){
      const {data} = await supabase.from("cartinhas").select("*").order("created_at",{ascending:false});
      const el = document.getElementById("listaCartas");
      if(!data || !data.length){ el.innerHTML = ""; return; }
      el.innerHTML = data.map(c=>`<div class="item"><div><strong>💌 ${c.titulo}</strong></div><button class="btn-excluir" onclick="excluir(${c.id},'carta')">Excluir</button></div>`).join('');
    }
    async function listarMsgs(){
      const {data} = await supabase.from("mensagens").select("*").order("created_at",{ascending:false});
      const el = document.getElementById("listaMsgs");
      if(!data || !data.length){ el.innerHTML = ""; return; }
      el.innerHTML = data.map(m=>`<div class="item"><span>${m.emoji} ${m.texto}</span><button class="btn-excluir" onclick="excluir(${m.id},'msg')">Excluir</button></div>`).join('');
    }
    window.excluir = async function(id, tipo){
      if(!confirm("Excluir?")) return;
      if(tipo==="carta") await supabase.from("cartinhas").delete().eq("id",id);
      else if(tipo==="msg") await supabase.from("mensagens").delete().eq("id",id);
      else await supabase.from("fotos").delete().eq("id",id);
      aviso("✅ Excluído!");
      await listarFotos(); await listarVideos(); await listarCartas(); await listarMsgs();
    };
  </script>
</body>
</html>
