<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Secreto 💙</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI', sans-serif;
      background:linear-gradient(135deg,#dbeafe,#eff6ff);
      min-height:100vh;
      padding:30px 20px;
    }
    .caixa{
      max-width:600px;
      margin:0 auto;
      background:#fff;
      border-radius:24px;
      padding:30px 20px;
      box-shadow:0 8px 32px rgba(59,130,246,.12);
    }
    h1{text-align:center; color:#3b82f6; margin-bottom:25px;}
    h2{color:#3b82f6; font-size:1.05rem; margin:30px 0 10px; padding-top:15px; border-top:1px solid #eee;}
    input,textarea,button{
      width:100%;
      padding:12px;
      margin:6px 0;
      border-radius:8px;
      border:1px solid #bfdbfe;
      font-size:1rem;
    }
    input[type="file"]{background:#eff6ff;}
    button{
      background:#3b82f6;
      color:#fff;
      border:none;
      cursor:pointer;
      font-weight:500;
      margin-top:8px;
    }
    button:hover{opacity:.92}
    .btn-excluir{
      background:#ef4444;
      width:auto;
      padding:6px 10px;
      font-size:.85rem;
      margin:0;
    }
    #aviso{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      padding:12px 20px;
      border-radius:10px;
      color:#fff;
      font-weight:500;
      z-index:999;
      opacity:0;
      transition:opacity .3s;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
      max-width:90%;
      text-align:center;
    }
    #aviso.ok{background:#10b981; opacity:1;}
    #aviso.erro{background:#ef4444; opacity:1;}
    .item{
      background:#f8fafc;
      padding:12px;
      border-radius:8px;
      margin:8px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .barra{height:6px; background:#dbeafe; border-radius:3px; overflow:hidden; margin:6px 0; display:none;}
    .barra span{display:block; height:100%; background:#3b82f6; width:0%; transition:width .3s;}
    .logs{background:#f0fdf4; border-left:4px solid #10b981; padding:12px; border-radius:8px; margin-bottom:20px; font-size:.9rem;}
  </style>
</head>
<body>

  <div id="aviso"></div>

  <div class="caixa">
    <h1>💙 Painel de Controle</h1>

    <div class="logs">
      <strong>📊 Acessos:</strong> <span id="total">0</span> | 
      <strong>Último:</strong> <span id="ultimo">---</span>
    </div>

    <h2>🎵 Música</h2>
    <input type="text" id="musicaNome" placeholder="Nome da música">
    <input type="file" id="musicaArq" accept="audio/*">
    <div class="barra" id="bm"><span></span></div>
    <button onclick="salvarMusica()">Salvar Música ✅</button>

    <h2>📸 Foto</h2>
    <input type="file" id="fotoArq" accept="image/*">
    <input type="text" id="fotoLeg" placeholder="Legenda">
    <div class="barra" id="bf"><span></span></div>
    <button onclick="salvarFoto()">Salvar Foto ✅</button>
    <div id="lf"></div>

    <h2>🎬 Vídeo</h2>
    <input type="file" id="videoArq" accept="video/*">
    <input type="text" id="videoLeg" placeholder="Legenda">
    <div class="barra" id="bv"><span></span></div>
    <button onclick="salvarVideo()">Salvar Vídeo ✅</button>
    <div id="lv"></div>

    <h2>💌 Cartinha</h2>
    <input type="text" id="cartaTit" placeholder="Título">
    <textarea id="cartaConteudo" rows="4" placeholder="Sua mensagem..."></textarea>
    <button onclick="salvarCarta()">Salvar Cartinha ✅</button>
    <div id="lc"></div>

    <h2>✨ Mensagem</h2>
    <input type="text" id="msgTexto" placeholder="Mensagem">
    <input type="text" id="msgEmoji" placeholder="Emoji" value="✨">
    <button onclick="salvarMsg()">Salvar ✅</button>
    <div id="lm"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = atob("aHR0cHM6Ly9ocmR5aG Ric2Nkem9laG91aXRleC5zdXBhYmFzZS5jbw==");
    const SUPABASE_KEY = atob("c2Jfc2VjcmV0XWk4Smd0LXp2ZGx4eTBPcTNFCG9zZ19aYkk0XzV3Qw==");
    const BUCKET = "site-amor";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function aviso(txt, ok=true){
      const el = document.getElementById("aviso");
      el.textContent = txt;
      el.className = ok ? "ok" : "erro";
      setTimeout(()=>el.style.opacity="0", 4000);
    }

    async function enviarArquivo(arquivo, pasta){
      const nomeArq = Date.now() + "_" + arquivo.name.replace(/[^a-z0-9.]/gi,'_');
      const caminho = pasta + "/" + nomeArq;
      const {data, error} = await supabase.storage.from(BUCKET).upload(caminho, arquivo);
      if(error) throw error;
      const {data:{publicUrl}} = supabase.storage.from(BUCKET).getPublicUrl(caminho);
      return publicUrl;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try{
        await supabase.from("logs_acesso").insert({data_acesso: new Date().toLocaleString("pt-BR")});
      }catch(e){}
      try{
        const {data} = await supabase.from("logs_acesso").select("*").order("id",{ascending:false});
        if(data && data.length>0){
          document.getElementById("total").textContent = data.length;
          document.getElementById("ultimo").textContent = data[0].data_acesso;
        }
      }catch(e){}
      await listarTudo();
    });

    async function salvarMusica(){
      const nome = document.getElementById("musicaNome").value.trim() || "Nossa Música 💙";
      const arq = document.getElementById("musicaArq").files[0];
      if(!arq) return aviso("⚠️ Escolha um arquivo!", false);
      try{
        document.getElementById("bm").style.display="block";
        document.querySelector("#bm span").style.width="50%";
        const url = await enviarArquivo(arq, "musicas");
        document.querySelector("#bm span").style.width="100%";
        const {error} = await supabase.from("configuracoes").upsert({id:1, musica_nome:nome, musica_url:url});
        if(error) throw error;
        aviso("✅ SALVO! Atualize a página principal!");
        document.getElementById("musicaNome").value="";
        document.getElementById("musicaArq").value="";
        setTimeout(()=>document.getElementById("bm").style.display="none",600);
      }catch(e){ aviso("❌ ERRO: "+e.message, false); document.getElementById("bm").style.display="none"; }
    }

    async function salvarFoto(){
      const arq = document.getElementById("fotoArq").files[0];
      const leg = document.getElementById("fotoLeg").value.trim();
      if(!arq) return aviso("⚠️ Escolha uma foto!", false);
      try{
        document.getElementById("bf").style.display="block";
        document.querySelector("#bf span").style.width="50%";
        const url = await enviarArquivo(arq, "fotos");
        document.querySelector("#bf span").style.width="100%";
        const {error} = await supabase.from("fotos").insert({url, legenda:leg, tipo:"foto"});
        if(error) throw error;
        aviso("✅ FOTO SALVA! Atualize a página principal!");
        document.getElementById("fotoArq").value="";
        document.getElementById("fotoLeg").value="";
        setTimeout(()=>document.getElementById("bf").style.display="none",600);
        await listarFotos();
      }catch(e){ aviso("❌ ERRO: "+e.message, false); document.getElementById("bf").style.display="none"; }
    }

    async function salvarVideo(){
      const arq = document.getElementById("videoArq").files[0];
      const leg = document.getElementById("videoLeg").value.trim();
      if(!arq) return aviso("⚠️ Escolha um vídeo!", false);
      try{
        document.getElementById("bv").style.display="block";
        document.querySelector("#bv span").style.width="50%";
        const url = await enviarArquivo(arq, "videos");
        document.querySelector("#bv span").style.width="100%";
        const {error} = await supabase.from("fotos").insert({url, legenda:leg, tipo:"video"});
        if(error) throw error;
        aviso("✅ VÍDEO SALVO! Atualize a página principal!");
        document.getElementById("videoArq").value="";
        document.getElementById("videoLeg").value="";
        setTimeout(()=>document.getElementById("bv").style.display="none",600);
        await listarVideos();
      }catch(e){ aviso("❌ ERRO: "+e.message, false); document.getElementById("bv").style.display="none"; }
    }

    async function salvarCarta(){
      const tit = document.getElementById("cartaTit").value.trim();
      const cnt = document.getElementById("cartaConteudo").value.trim();
      if(!tit || !cnt) return aviso("⚠️ Preencha tudo!", false);
      try{
        const {error} = await supabase.from("cartinhas").insert({titulo:tit, conteudo:cnt});
        if(error) throw error;
        aviso("✅ CARTINHA SALVA! Atualize a página principal!");
        document.getElementById("cartaTit").value="";
        document.getElementById("cartaConteudo").value="";
        await listarCartas();
      }catch(e){ aviso("❌ ERRO: "+e.message, false); }
    }

    async function salvarMsg(){
      const txt = document.getElementById("msgTexto").value.trim();
      const emj = document.getElementById("msgEmoji").value.trim() || "✨";
      if(!txt) return aviso("⚠️ Escreva a mensagem!", false);
      try{
        const {error} = await supabase.from("mensagens").insert({texto:txt, emoji:emj});
        if(error) throw error;
        aviso("✅ MENSAGEM SALVA! Atualize a página principal!");
        document.getElementById("msgTexto").value="";
        await listarMsgs();
      }catch(e){ aviso("❌ ERRO: "+e.message, false); }
    }

    async function excluir(id, tabela){
      if(!confirm("Excluir mesmo?")) return;
      await supabase.from(tabela).delete().eq("id",id);
      aviso("✅ Excluído!");
      await listarTudo();
    }

    async function listarFotos(){
      const {data} = await supabase.from("fotos").select("*").eq("tipo","foto").order("created_at",{ascending:false});
      document.getElementById("lf").innerHTML = data?.map(f=>`<div class="item"><span>📸 ${f.legenda||''}</span><button class="btn-excluir" onclick="excluir(${f.id},'fotos')">Excluir</button></div>`).join('')||'';
    }
    async function listarVideos(){
      const {data} = await supabase.from("fotos").select("*").eq("tipo","video").order("created_at",{ascending:false});
      document.getElementById("lv").innerHTML = data?.map(v=>`<div class="item"><span>🎬 ${v.legenda||''}</span><button class="btn-excluir" onclick="excluir(${v.id},'fotos')">Excluir</button></div>`).join('')||'';
    }
    async function listarCartas(){
      const {data} = await supabase.from("cartinhas").select("*").order("created_at",{ascending:false});
      document.getElementById("lc").innerHTML = data?.map(c=>`<div class="item"><span>💌 ${c.titulo}</span><button class="btn-excluir" onclick="excluir(${c.id},'cartinhas')">Excluir</button></div>`).join('')||'';
    }
    async function listarMsgs(){
      const {data} = await supabase.from("mensagens").select("*").order("created_at",{ascending:false});
      document.getElementById("lm").innerHTML = data?.map(m=>`<div class="item"><span>${m.emoji} ${m.texto}</span><button class="btn-excluir" onclick="excluir(${m.id},'mensagens')">Excluir</button></div>`).join('')||'';
    }
    async function listarTudo(){
      await listarFotos(); await listarVideos(); await listarCartas(); await listarMsgs();
    }
  </script>
</body>
</html>
